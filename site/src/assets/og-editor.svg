    <rect x="346" y="221" width="3" height="55" rx="1.5" fill="#ea580c"/>
    <text x="356" y="240" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="7">“carefully”</text>
    <text x="356" y="256" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="6">Check the modifier.</text>
